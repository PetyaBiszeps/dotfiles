# ~/.config/yazi/yazi.toml

[mgr]
ratio = [1, 3, 4]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "size"
show_hidden = true
show_symlink = true
scrolloff = 8
mouse_events = [ "click", "scroll", "touch", "move", "drag" ]
title_format = "Yazi: {cwd}"

[preview]
wrap = "yes"
tab_size = 2
max_width = 1200
max_height = 1800

[opener]
edit = [
  { run = '${EDITOR:-nvim} "$@"', block = true, desc = "Edit" }
]

open = [
  { run = 'xdg-open "$@"', orphan = true, desc = "Open" },
  { run = 'open "$@"', orphan = true, desc = "Open" }
]

reveal = [
  { run = 'xdg-open "$(dirname "$1")"', orphan = true, desc = "Reveal" },
  { run = 'open -R "$1"', orphan = true, desc = "Reveal" }
]

[open]
rules = [
  { mime = "text/*", use = "edit" },
  { mime = "application/json", use = "edit" },
  { mime = "application/x-shellscript", use = "edit" },

  { url = "*.toml", use = "edit" },
  { url = "*.nix", use = "edit" },
  { url = "*.lua", use = "edit" },
  { url = "*.md", use = "edit" },

  { mime = "image/*", use = "open" },
  { mime = "video/*", use = "open" },
  { mime = "audio/*", use = "open" },
  { mime = "application/pdf", use = "open" },

  { url = "*/", use = "open" },
  { url = "*", use = "open" }
]

[tasks]
micro_workers = 10
macro_workers = 25
bizarre_retry = 5
image_alloc = 536870912
image_bound = [0, 0]
suppress_preload = false
